name: Test build scripts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate shipped resource packs
        run: |
          cp -r resourcepacks "$RUNNER_TEMP/dj2-resourcepacks"
          python scripts/prepare_resourcepacks.py "$RUNNER_TEMP/dj2-resourcepacks"
          python scripts/prepare_resourcepacks.py --check "$RUNNER_TEMP/dj2-resourcepacks"
